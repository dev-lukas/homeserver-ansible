---
# Fails fast on the controller when Proton Pass is not ready, before any
# lookup or SSH connection produces a less obvious error.

- name: Check the Proton Pass session
  ansible.builtin.command: pass-cli info
  changed_when: false
  failed_when: false
  register: secrets_preflight_session
  delegate_to: localhost
  become: false
  run_once: true

- name: Check the Proton Pass SSH agent socket
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.ssh/proton-pass-agent.sock"
  register: secrets_preflight_socket
  delegate_to: localhost
  become: false
  run_once: true

- name: Stop with setup instructions when Proton Pass is not ready
  ansible.builtin.assert:
    that:
      - secrets_preflight_session.rc == 0
      - secrets_preflight_socket.stat.exists
    fail_msg: >-
      Proton Pass is not ready on the controller. Run `pass-cli login`, then
      `systemctl start proton-pass-ssh-agent`. See README, section Secrets.
    quiet: true
  delegate_to: localhost
  become: false
  run_once: true
