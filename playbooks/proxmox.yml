---
# Proxmox host configuration

- name: Configure Proxmox hosts
  hosts: proxmox
  become: true
  gather_facts: false  # Deferred until the preflight has run

  pre_tasks:
    - name: Verify Proton Pass session and SSH agent on the controller
      ansible.builtin.include_tasks: tasks/secrets_preflight.yml
      tags: always

    - name: Gather facts after deploy key is ready
      ansible.builtin.setup:
      tags: always

  roles:
    # Proxmox host roles
    - role: proxmox_root/proxmox_repos
      tags:
        - repos
        - apt

    - role: proxmox_root/common
      tags:
        - common
        - always

    - role: proxmox_root/power_management
      tags:
        - power

    - role: proxmox_root/ups
      tags:
        - ups
        - nut

    - role: proxmox_root/glances
      tags:
        - glances
        - monitoring

    - role: proxmox_root/micron_msecli
      tags:
        - msecli
        - micron
        - ssd

    - role: proxmox_root/rasdaemon
      tags:
        - rasdaemon
        - ecc
        - monitoring

    # LXC/VM roles
    - role: adguard_lxc
      tags:
        - adguard
        - lxc
        - containers

    # Must precede the reverse proxy that publishes it as registry.lukas-roth.dev.
    - role: registry_lxc
      tags:
        - registry
        - lxc
        - containers

    - role: homeassistant_vm
      tags:
        - homeassistant
        - haos
        - vm

    - role: reverse_proxy_lxc
      tags:
        - reverse_proxy
        - nginx
        - lxc
        - containers

    # Combined apps LXC; the single source for the former immich_vm + local_services_vm.
    - role: local_services_lxc
      tags:
        - apps_lxc
        - local_services
        - immich
        - lxc
        - containers

    - role: jellyfin_lxc
      tags:
        - jellyfin
        - media
        - lxc
        - containers

    # Media services LXC (gluetun + *arr); the single source for the former media_services_vm.
    - role: media_services_lxc
      tags:
        - media_lxc
        - arr
        - lxc
        - containers

    - role: dev_vm
      tags:
        - dev
        - dev_vm
        - vm

    # Lets Home Assistant power the dev VM; after dev_vm so its vars are in scope.
    - role: proxmox_root/ha_vm_control
      tags:
        - ha_vm_control
        - dev
        - dev_vm
        - power

    - role: ci_runner_vm
      tags:
        - ci_runner
        - ci
        - vm

    # On-demand watchdog for the CI VM; after ci_runner_vm so its vars are in scope.
    - role: proxmox_root/ci_runner_autostart
      tags:
        - ci_runner_autostart
        - ci_runner
        - ci
        - power
