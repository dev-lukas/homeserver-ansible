---
# Maintenance playbook - Updates all infrastructure components
# Usage: ansible-playbook playbooks/maintenance.yml --ask-vault-pass
# Or target a single guest via its play tag, e.g.:
#   ansible-playbook playbooks/maintenance.yml --ask-vault-pass --tags immich
#
# Covered guests: Proxmox host, AdGuard LXC (100), Reverse Proxy LXC (103),
# Registry LXC (106), Apps LXC (102: Immich + local services), Jellyfin LXC
# (105), Media Services LXC, Dev VM, CI Runner VM (108, woken on demand).
# NOT covered on purpose: Home Assistant VM - HAOS is an appliance that
# manages its own OS/core updates through Home Assistant itself.

- name: Maintenance - Proxmox Host
  hosts: proxmox-root
  gather_facts: false
  tags: [proxmox, maintenance]
  vars:
    glances_venv_path: "{{ hostvars['proxmox-root']['glances_venv_path'] | default('/opt/glances') }}"
    glances_port: "{{ hostvars['proxmox-root']['glances_port'] | default(61208) }}"
  pre_tasks:
    - name: Write deploy key to temp file
      ansible.builtin.copy:
        content: "{{ vault_ansible_deploy_private_key }}"
        dest: /tmp/.ansible_deploy_key
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      tags: always

  tasks:
    - name: Recover from any interrupted package operation
      ansible.builtin.command:
        cmd: dpkg --configure -a
      changed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 600

    - name: Upgrade packages (no dist-upgrade)
      ansible.builtin.apt:
        upgrade: safe
        lock_timeout: 600
      register: apt_upgrade
      until: apt_upgrade is succeeded
      retries: 3
      delay: 30

    - name: Remove unused packages
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
        lock_timeout: 600

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Record Proxmox maintenance result (reboot is report-only)
      ansible.builtin.set_fact:
        maintenance_report: "{{ maintenance_report | default([]) + [_entry] }}"
      vars:
        _entry:
          host: "Proxmox host"
          upgraded: "{{ apt_upgrade.changed }}"
          reboot_required: "{{ reboot_required.stat.exists | default(false) }}"
          rebooted: false

    - name: Check if Glances venv exists
      ansible.builtin.stat:
        path: "{{ glances_venv_path }}/bin/pip"
      register: glances_venv

    - name: Update Glances in venv
      ansible.builtin.pip:
        name:
          - glances[web]
        state: latest
        virtualenv: "{{ glances_venv_path }}"
      register: glances_update
      when: glances_venv.stat.exists

    - name: Restart Glances if updated
      ansible.builtin.systemd:
        name: glances
        state: restarted
      when:
        - glances_venv.stat.exists
        - glances_update is defined
        - glances_update.changed

    - name: Verify Glances API is reachable
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ glances_port }}/api/4/status"
        method: GET
        status_code: [200]
      register: glances_health
      retries: 3
      delay: 5
      until: glances_health.status == 200
      when: glances_venv.stat.exists

    - name: Set Glances maintenance status
      ansible.builtin.set_fact:
        glances_maintenance_status: >-
          {{
            'updated' if (glances_venv.stat.exists and glances_update is defined and glances_update.changed)
            else 'up-to-date' if glances_venv.stat.exists
            else 'not-installed'
          }}

    - name: Display update summary
      ansible.builtin.debug:
        msg: |
          Proxmox host updated.
          Packages upgraded: {{ apt_upgrade.changed }}
          Reboot required: {{ reboot_required.stat.exists | default(false) }}
          Glances status: {{ glances_maintenance_status | default('not-checked') }}

- name: Maintenance - AdGuard LXC
  hosts: proxmox-root
  gather_facts: false
  tags: [adguard, maintenance]
  vars:
    adguard_vmid: "{{ hostvars['proxmox-root']['adguard_vmid'] | default(100) }}"
    # `pct exec` can wedge after the inner command finishes and the command
    # module has no timeout, so cap it: otherwise one hang blocks the run.
    adguard_apk_timeout: 900
    adguard_binary_timeout: 300
  tasks:
    - name: Upgrade Alpine packages (timeout-capped, retried)
      ansible.builtin.shell:
        cmd: "timeout -k 30 {{ adguard_apk_timeout }} pct exec {{ adguard_vmid }} -- sh -s"
        stdin: "{{ apk_maintenance_script }}"
      register: apk_upgrade
      changed_when: "'PKGS_CHANGED' in apk_upgrade.stdout"
      until: apk_upgrade.rc == 0
      retries: 3
      delay: 30

    # Fetches from GitHub: failed_when covers a bad exit, not a stalled fetch.
    - name: Update AdGuard Home binary
      ansible.builtin.command:
        cmd: >-
          timeout -k 15 {{ adguard_binary_timeout }}
          pct exec {{ adguard_vmid }} --
          /opt/AdGuardHome/AdGuardHome --update
      register: adguard_update
      changed_when: "'updated' in adguard_update.stdout | lower"
      failed_when: false

    - name: Display AdGuard update result
      ansible.builtin.debug:
        msg: >-
          {{
            'TIMED OUT after ' ~ adguard_binary_timeout ~ 's - binary left untouched, rerun with --tags adguard'
            if adguard_update.rc == 124
            else (adguard_update.stdout | default('AdGuard update completed'))
          }}

    - name: Record AdGuard maintenance result
      ansible.builtin.set_fact:
        maintenance_report: "{{ maintenance_report | default([]) + [_entry] }}"
      vars:
        _entry:
          host: "AdGuard LXC"
          upgraded: "{{ apk_upgrade.changed }}"
          reboot_required: false
          rebooted: false

- name: Maintenance - Reverse Proxy LXC
  hosts: proxmox-root
  gather_facts: false
  tags: [reverse_proxy, maintenance]
  vars:
    reverse_proxy_vmid: "{{ hostvars['proxmox-root']['reverse_proxy_vmid'] | default(103) }}"
  tasks:
    - name: Upgrade packages (lock-aware, self-healing, retried)
      ansible.builtin.shell:
        cmd: "pct exec {{ reverse_proxy_vmid }} -- bash -s"
        stdin: "{{ apt_maintenance_script }}"
      register: apt_upgrade
      changed_when: "'PKGS_CHANGED' in apt_upgrade.stdout"
      until: apt_upgrade.rc == 0
      retries: 3
      delay: 30

    - name: Check if nginx needs reload
      ansible.builtin.command:
        cmd: "pct exec {{ reverse_proxy_vmid }} -- nginx -t"
      register: nginx_test
      changed_when: false
      failed_when: false

    - name: Reload nginx if config is valid
      ansible.builtin.command:
        cmd: "pct exec {{ reverse_proxy_vmid }} -- systemctl reload nginx"
      when: nginx_test.rc == 0
      changed_when: false

    # Report-only: never auto-reboot the proxy (it fronts every service);
    # the summary flags it so the reboot can be done at a convenient time.
    - name: Check if reboot is required
      ansible.builtin.command:
        cmd: "pct exec {{ reverse_proxy_vmid }} -- test -f /var/run/reboot-required"
      register: rp_reboot
      changed_when: false
      failed_when: false

    - name: Record Reverse Proxy maintenance result
      ansible.builtin.set_fact:
        maintenance_report: "{{ maintenance_report | default([]) + [_entry] }}"
      vars:
        _entry:
          host: "Reverse Proxy LXC"
          upgraded: "{{ apt_upgrade.changed }}"
          reboot_required: "{{ rp_reboot.rc == 0 }}"
          rebooted: false

- name: Maintenance - Registry LXC
  hosts: proxmox-root
  gather_facts: false
  tags: [registry, maintenance]
  vars:
    registry_vmid: "{{ hostvars['proxmox-root']['registry_lxc_vmid'] | default(106) }}"
    registry_port: "{{ hostvars['proxmox-root']['registry_lxc_port'] | default(5000) }}"
  tasks:
    # The registry LXC only exists after the CI-VM -> LXC 106 cutover
    # (docs/registry.md); skip cleanly until it is live.
    - name: Check registry LXC status
      ansible.builtin.command:
        cmd: "pct status {{ registry_vmid }}"
      register: registry_status
      changed_when: false
      failed_when: false

    - name: Note skipped registry LXC
      ansible.builtin.debug:
        msg: "Registry LXC {{ registry_vmid }} not present/running - skipping (pre-cutover?)"
      when: "'running' not in registry_status.stdout"

    - name: Maintain registry LXC
      when: "'running' in registry_status.stdout"
      block:
        # OS packages only. The registry binary itself is pinned + checksummed
        # (registry_lxc_version); bump it via proxmox.yml --tags registry.
        - name: Upgrade packages (lock-aware, self-healing, retried)
          ansible.builtin.shell:
            cmd: "pct exec {{ registry_vmid }} -- bash -s"
            stdin: "{{ apt_maintenance_script }}"
          register: apt_upgrade
          changed_when: "'PKGS_CHANGED' in apt_upgrade.stdout"
          until: apt_upgrade.rc == 0
          retries: 3
          delay: 30

        - name: Check if reboot is required
          ansible.builtin.command:
            cmd: "pct exec {{ registry_vmid }} -- test -f /var/run/reboot-required"
          register: registry_reboot
          changed_when: false
          failed_when: false

        # An LXC reboot is a few seconds of downtime; pulls simply retry.
        - name: Reboot registry LXC to apply updates
          ansible.builtin.command:
            cmd: "pct reboot {{ registry_vmid }}"
          when: registry_reboot.rc == 0
          changed_when: true

        - name: Wait for registry to answer (401 = up, auth enforced)
          ansible.builtin.command:
            cmd: >-
              pct exec {{ registry_vmid }} -- curl -sSk -o /dev/null
              -w '%{http_code}' https://127.0.0.1:{{ registry_port }}/v2/
          register: registry_health
          retries: 20
          delay: 5
          until: registry_health.stdout == "401"
          changed_when: false

        - name: Record Registry maintenance result
          ansible.builtin.set_fact:
            maintenance_report: "{{ maintenance_report | default([]) + [_entry] }}"
          vars:
            _entry:
              host: "Registry LXC"
              upgraded: "{{ apt_upgrade.changed }}"
              reboot_required: "{{ registry_reboot.rc == 0 }}"
              rebooted: "{{ registry_reboot.rc == 0 }}"

- name: Maintenance - Jellyfin LXC
  hosts: proxmox-root
  gather_facts: false
  tags: [jellyfin, maintenance]
  vars:
    jellyfin_vmid: "{{ hostvars['proxmox-root']['jellyfin_vmid'] | default(105) }}"
  tasks:
    # Jellyfin is installed from its apt repo inside the LXC, so the regular
    # apt upgrade also updates Jellyfin itself.
    - name: Upgrade packages (lock-aware, self-healing, retried)
      ansible.builtin.shell:
        cmd: "pct exec {{ jellyfin_vmid }} -- bash -s"
        stdin: "{{ apt_maintenance_script }}"
      register: apt_upgrade
      changed_when: "'PKGS_CHANGED' in apt_upgrade.stdout"
      until: apt_upgrade.rc == 0
      retries: 3
      delay: 30

    - name: Verify Jellyfin service is active
      ansible.builtin.command:
        cmd: "pct exec {{ jellyfin_vmid }} -- systemctl is-active jellyfin"
      register: jellyfin_active
      retries: 6
      delay: 10
      until: jellyfin_active.rc == 0
      changed_when: false

    # Report-only: never auto-reboot (may interrupt an active stream).
    - name: Check if reboot is required
      ansible.builtin.command:
        cmd: "pct exec {{ jellyfin_vmid }} -- test -f /var/run/reboot-required"
      register: jellyfin_reboot
      changed_when: false
      failed_when: false

    - name: Record Jellyfin maintenance result
      ansible.builtin.set_fact:
        maintenance_report: "{{ maintenance_report | default([]) + [_entry] }}"
      vars:
        _entry:
          host: "Jellyfin LXC"
          upgraded: "{{ apt_upgrade.changed }}"
          reboot_required: "{{ jellyfin_reboot.rc == 0 }}"
          rebooted: false

# One play for the combined apps LXC (102): the former "Local Services VM"
# and "Immich VM" plays both targeted this same guest, running the apt
# maintenance (and a possible reboot) twice per run.
- name: Maintenance - Apps LXC (Immich + local services)
  hosts: proxmox-root
  gather_facts: false
  tags: [apps_lxc, local_services, immich, maintenance]
  vars:
    apps_ip: "192.168.178.15"
    stacks_dir: "/opt/stacks"
    ssh_key_path: "/tmp/.ansible_deploy_key"
    ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i {{ ssh_key_path }}"
    immich_web_port: 2283
    # Immich uses the floating `release` tag (immich_version), so pull+up
    # performs the app update; the pinned postgres image is not touched.
    apps_stacks:
      - immich
      - bentopdf
      - vert
      - mealie
      - homepage

  pre_tasks:
    - name: Write deploy key to temp file on Proxmox
      ansible.builtin.copy:
        content: "{{ vault_ansible_deploy_private_key }}"
        dest: "{{ ssh_key_path }}"
        mode: "0600"
      no_log: true

  tasks:
    - name: Run hardened apt maintenance
      ansible.builtin.include_tasks: tasks/maintenance_apt.yml
      vars:
        maint_label: "Apps LXC"
        maint_ip: "{{ apps_ip }}"
        maint_auto_reboot: true

    - name: Pull and recreate Docker stacks
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ apps_ip }} 'cd {{ stacks_dir }}/{{ item }} && docker compose pull && docker compose up -d'"
      loop: "{{ apps_stacks }}"
      register: stack_updates
      changed_when: false

    # Immich runs DB migrations on version jumps; give it time to come up
    # before declaring the run healthy.
    - name: Wait for Immich to answer after update
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ apps_ip }} 'curl -fsS -o /dev/null http://127.0.0.1:{{ immich_web_port }}/api/server/ping'"
      register: immich_ping
      retries: 60
      delay: 5
      until: immich_ping.rc == 0
      changed_when: false

    - name: Prune unused Docker images
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ apps_ip }} docker image prune -f"
      register: prune_result
      changed_when: false

    - name: Display Docker update summary
      ansible.builtin.debug:
        msg: |
          Apps LXC updated.
          Docker stacks recreated: {{ apps_stacks | join(', ') }}
          Pruned: {{ prune_result.stdout_lines[-1] | default('Done') }}

  post_tasks:
    - name: Remove deploy key from Proxmox
      ansible.builtin.file:
        path: "{{ ssh_key_path }}"
        state: absent

    - name: Remove local deploy key
      ansible.builtin.file:
        path: /tmp/.ansible_deploy_key
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      tags: always

- name: Maintenance - Media Services VM
  hosts: proxmox-root
  gather_facts: false
  tags: [media_services, maintenance]
  vars:
    media_services_ip: "{{ hostvars['proxmox-root']['media_services_ip'] | default('192.168.178.11') }}"
    stacks_dir: "/opt/stacks"
    ssh_key_path: "/tmp/.ansible_deploy_key"
    ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i {{ ssh_key_path }}"
    # Stacks that have their own network
    media_services_standalone_stacks:
      - sonarr
      - sonarr-anime
      - radarr
      - radarr-anime
    # Stacks using network_mode: container:gluetun (must be restarted after gluetun)
    media_services_gluetun_stacks:
      - prowlarr
      - sabnzbd
      - qbittorrent
      - umlautadaptarr

  pre_tasks:
    - name: Write deploy key to temp file on Proxmox
      ansible.builtin.copy:
        content: "{{ vault_ansible_deploy_private_key }}"
        dest: "{{ ssh_key_path }}"
        mode: "0600"
      no_log: true

  tasks:
    - name: Run hardened apt maintenance
      ansible.builtin.include_tasks: tasks/maintenance_apt.yml
      vars:
        maint_label: "Media Services VM"
        maint_ip: "{{ media_services_ip }}"
        maint_auto_reboot: true

    - name: Pull all Docker images
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ media_services_ip }} 'cd {{ stacks_dir }}/{{ item }} && docker compose pull'"
      loop: "{{ ['gluetun'] + media_services_gluetun_stacks + media_services_standalone_stacks }}"
      changed_when: false

    - name: Update standalone stacks
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ media_services_ip }} 'cd {{ stacks_dir }}/{{ item }} && docker compose up -d'"
      loop: "{{ media_services_standalone_stacks }}"
      changed_when: false

    - name: Stop gluetun-dependent stacks
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ media_services_ip }} 'cd {{ stacks_dir }}/{{ item }} && docker compose down'"
      loop: "{{ media_services_gluetun_stacks }}"
      changed_when: false

    - name: Update gluetun
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ media_services_ip }} 'cd {{ stacks_dir }}/gluetun && docker compose up -d'"
      changed_when: false

    - name: Start gluetun-dependent stacks
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ media_services_ip }} 'cd {{ stacks_dir }}/{{ item }} && docker compose up -d'"
      loop: "{{ media_services_gluetun_stacks }}"
      changed_when: false

    - name: Prune unused Docker images
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ media_services_ip }} docker image prune -f"
      register: prune_result
      changed_when: false

    - name: Display update summary
      ansible.builtin.debug:
        msg: |
          Media Services VM updated.
          Packages upgraded: {{ maint_apt.changed }}
          Pruned: {{ prune_result.stdout_lines[-1] | default('Done') }}

  post_tasks:
    - name: Remove deploy key from Proxmox
      ansible.builtin.file:
        path: "{{ ssh_key_path }}"
        state: absent

    - name: Remove local deploy key
      ansible.builtin.file:
        path: /tmp/.ansible_deploy_key
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      tags: always

- name: Maintenance - Development VM
  hosts: proxmox-root
  gather_facts: false
  tags: [dev_vm, maintenance]
  vars:
    dev_vm_ip: "{{ hostvars['proxmox-root']['dev_vm_ip'] | default('192.168.178.12') }}"
    ssh_key_path: "/tmp/.ansible_deploy_key"
    ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i {{ ssh_key_path }}"

  pre_tasks:
    - name: Write deploy key to temp file on Proxmox
      ansible.builtin.copy:
        content: "{{ vault_ansible_deploy_private_key }}"
        dest: "{{ ssh_key_path }}"
        mode: "0600"
      no_log: true

  tasks:
    - name: Run hardened apt maintenance
      ansible.builtin.include_tasks: tasks/maintenance_apt.yml
      vars:
        maint_label: "Development VM"
        maint_ip: "{{ dev_vm_ip }}"
        # Report-only: never auto-reboot the dev VM (may have live work/sessions).
        maint_auto_reboot: false

    - name: Update Claude Code
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ dev_vm_ip }} 'claude update'"
      register: claude_update
      changed_when: false
      failed_when: false

    - name: Display update summary
      ansible.builtin.debug:
        msg: |
          Development VM updated.
          Packages upgraded: {{ maint_apt.changed }}
          Claude Code: {{ claude_update.stdout | default('update attempted') }}

  post_tasks:
    - name: Remove deploy key from Proxmox
      ansible.builtin.file:
        path: "{{ ssh_key_path }}"
        state: absent

    - name: Remove local deploy key
      ansible.builtin.file:
        path: /tmp/.ansible_deploy_key
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      tags: always

- name: Maintenance - CI Runner VM
  hosts: proxmox-root
  gather_facts: false
  tags: [ci_runner, maintenance]
  vars:
    ci_runner_ip: "{{ hostvars['proxmox-root']['ci_runner_ip'] | default('192.168.178.13') }}"
    ci_runner_vmid: "{{ hostvars['proxmox-root']['ci_runner_vmid'] | default(108) }}"
    ssh_key_path: "/tmp/.ansible_deploy_key"
    ssh_opts: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i {{ ssh_key_path }}"

  pre_tasks:
    - name: Write deploy key to temp file on Proxmox
      ansible.builtin.copy:
        content: "{{ vault_ansible_deploy_private_key }}"
        dest: "{{ ssh_key_path }}"
        mode: "0600"
      no_log: true

  tasks:
    # The CI VM is on-demand (onboot 0, watchdog-managed): wake it for
    # maintenance and shut it down again afterwards if we started it.
    - name: Check CI runner VM status
      ansible.builtin.command:
        cmd: "qm status {{ ci_runner_vmid }}"
      register: ci_vm_status
      changed_when: false

    - name: Start CI runner VM for maintenance
      ansible.builtin.command:
        cmd: "qm start {{ ci_runner_vmid }}"
      when: "'running' not in ci_vm_status.stdout"
      changed_when: true

    - name: Wait for CI runner SSH
      ansible.builtin.wait_for:
        host: "{{ ci_runner_ip }}"
        port: 22
        timeout: 300
      when: "'running' not in ci_vm_status.stdout"

    - name: Run hardened apt maintenance
      ansible.builtin.include_tasks: tasks/maintenance_apt.yml
      vars:
        maint_label: "CI Runner VM"
        maint_ip: "{{ ci_runner_ip }}"
        # Set to false if you want to avoid interrupting in-flight CI jobs.
        maint_auto_reboot: true

    # Legacy docker registry on the CI VM; gone after the LXC-106 cutover
    # (docs/registry.md), so skip when the stack directory no longer exists.
    - name: Update legacy registry container (pre-cutover only)
      ansible.builtin.shell:
        cmd: >-
          ssh {{ ssh_opts }} root@{{ ci_runner_ip }}
          'if [ -d /opt/stacks/registry ]; then
             cd /opt/stacks/registry && docker compose pull && docker compose up -d;
           else echo LEGACY_REGISTRY_ABSENT; fi'
      register: legacy_registry
      changed_when: false

    - name: Prune unused Docker images
      ansible.builtin.shell:
        cmd: "ssh {{ ssh_opts }} root@{{ ci_runner_ip }} docker image prune -f"
      register: prune_result
      changed_when: false

    - name: Display update summary
      ansible.builtin.debug:
        msg: |
          CI Runner VM updated.
          Packages upgraded: {{ maint_apt.changed }}
          Legacy registry: {{ 'absent (LXC 106 is authoritative)' if 'LEGACY_REGISTRY_ABSENT' in legacy_registry.stdout else 'updated' }}
          Pruned: {{ prune_result.stdout_lines[-1] | default('Done') }}

    - name: Shut CI runner VM back down (was only started for maintenance)
      ansible.builtin.command:
        cmd: "qm shutdown {{ ci_runner_vmid }} --timeout 120"
      when: "'running' not in ci_vm_status.stdout"
      changed_when: true

  post_tasks:
    - name: Remove deploy key from Proxmox
      ansible.builtin.file:
        path: "{{ ssh_key_path }}"
        state: absent

    - name: Remove local deploy key
      ansible.builtin.file:
        path: /tmp/.ansible_deploy_key
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      tags: always

- name: Maintenance - Summary
  hosts: proxmox-root
  gather_facts: false
  tags: [always]
  tasks:
    - name: Maintenance summary (per host)
      ansible.builtin.debug:
        msg: |-
          ===== Maintenance summary =====
          {% for h in maintenance_report | default([]) %}
          {{ "%-20s" | format(h.host) }} upgraded={{ h.upgraded }} reboot_required={{ h.reboot_required }} rebooted={{ h.rebooted }}
          {% endfor %}
          {% set pending = maintenance_report | default([]) | selectattr('reboot_required') | rejectattr('rebooted') | map(attribute='host') | list %}
          {% if pending | length > 0 %}
          ACTION NEEDED - reboot still pending on: {{ pending | join(', ') }}
          {% else %}
          No outstanding reboots.
          {% endif %}

- import_playbook: reverse_proxy_verify.yml
