---
# Variables specific to Proxmox hosts

# Network
internal_subnet: "192.168.178.0/24"

# Power management settings
powertop_auto_tune: true
# Kernel-native NIC ASPM regime (replaced autoaspm_enabled / setpci era).
# Requires BIOS "Native ASPM" = Enabled (hidden Setup option, see
# roles/proxmox_root/power_management/tasks/nic_pm.yml header).
nic_pm_enabled: true
ltr_ignore_enabled: true
