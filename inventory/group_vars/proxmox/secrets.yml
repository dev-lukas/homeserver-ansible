---
# Every secret is fetched at run time from Proton Pass through pass-cli
# (community.general.proton_pass). Nothing secret lives in this repo.
#
# Layout in Proton Pass (vault names come from ansible.cfg [proton_pass_lookup]):
#   vault "homeserver": one item per service, secrets as hidden custom fields
#     whose names match the field= arguments below.
#   vault "ssh-keys":   SSH Key items; the same vault feeds the SSH agent.
#
# Lookups are lazy, so a play only fetches the secrets it references. Run
# `pass-cli login` once on the controller before running any playbook.

# --- Ansible deploy key (SSH Key item; the agent serves the private half) ---
secret_ansible_deploy_public_key: "{{ lookup('proton_pass', 'ansible-deploy', field='public_key', vault=secrets_ssh_vault) }}"

# --- GitHub ------------------------------------------------------------------
secret_github_runner_pat: "{{ lookup('proton_pass', 'github-runner', field='pat') }}"

# --- Reverse proxy -----------------------------------------------------------
secret_hetzner_api_token: "{{ lookup('proton_pass', 'hetzner-dns', field='api_token') }}"
secret_maxmind_account_id: "{{ lookup('proton_pass', 'maxmind', field='account_id') }}"
secret_maxmind_license_key: "{{ lookup('proton_pass', 'maxmind', field='license_key') }}"
secret_crowdsec_enroll_key: "{{ lookup('proton_pass', 'crowdsec', field='enroll_key') }}"
# Dict of backend name -> htpasswd file content; one hidden field per backend.
secret_reverse_proxy_auth_basic_users: "{{ lookup('proton_pass', 'reverse-proxy-basic-auth') }}"

# --- Registry ----------------------------------------------------------------
secret_registry_retention_credentials: "{{ lookup('proton_pass', 'registry-retention', field='credentials') }}"

# --- Apps LXC ----------------------------------------------------------------
secret_immich_db_password: "{{ lookup('proton_pass', 'immich', field='db_password') }}"

# --- AdGuard -----------------------------------------------------------------
secret_adguard_admin_user: "{{ lookup('proton_pass', 'adguard', field='username') }}"
secret_adguard_admin_password: "{{ lookup('proton_pass', 'adguard', field='password') }}"
secret_adguard_admin_password_hash: "{{ lookup('proton_pass', 'adguard', field='password_hash') }}"

# --- UPS (consumed directly by the ups role) --------------------------------
ups_monitor_password: "{{ lookup('proton_pass', 'ups', field='monitor_password') }}"

# --- Media services ----------------------------------------------------------
secret_sonarr_api_key: "{{ lookup('proton_pass', 'sonarr', field='api_key') }}"
secret_radarr_api_key: "{{ lookup('proton_pass', 'radarr', field='api_key') }}"
secret_sonarr_anime_api_key: "{{ lookup('proton_pass', 'sonarr-anime', field='api_key') }}"
secret_radarr_anime_api_key: "{{ lookup('proton_pass', 'radarr-anime', field='api_key') }}"
secret_protonvpn_wireguard_private_key: "{{ lookup('proton_pass', 'protonvpn-wireguard', field='private_key') }}"
secret_protonvpn_wireguard_addresses: "{{ lookup('proton_pass', 'protonvpn-wireguard', field='addresses') }}"
