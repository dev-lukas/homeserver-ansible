  - "{{ secret_ansible_deploy_public_key | default(omit) }}"
timezone: "Europe/Berlin"

# Proton Pass vault holding SSH Key items (agent + deploy public key lookup).
secrets_ssh_vault: ssh-keys

# Hardened apt upgrade for every Debian guest, piped into `bash -s`; the lock
# timeout is what keeps runs from failing under a pile of updates.
apt_maintenance_script: |
  set -euo pipefail
  export DEBIAN_FRONTEND=noninteractive
  APT_OPTS="-o DPkg::Lock::Timeout=600 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
  dpkg --configure -a || true
  apt-get $APT_OPTS update
  upgrade_out=$(apt-get $APT_OPTS -y upgrade)
  printf '%s\n' "$upgrade_out"
  apt-get $APT_OPTS -y autoremove
  apt-get $APT_OPTS clean
  if ! printf '%s\n' "$upgrade_out" | grep -q '^0 upgraded, 0 newly installed, 0 to remove'; then
    echo "PKGS_CHANGED"
  fi

# Alpine counterpart, piped into `sh -s` through `pct exec`. stdin from /dev/null
# so no child holds the exec pipe; callers must still wrap the exec in `timeout`.
apk_maintenance_script: |
  set -eu
  apk update
  upgrade_out=$(apk upgrade --no-cache 2>&1 </dev/null)
  printf '%s\n' "$upgrade_out"
  if printf '%s\n' "$upgrade_out" | grep -qE '^\([0-9]+/[0-9]+\) (Upgrading|Installing|Purging)'; then
    echo "PKGS_CHANGED"
  fi
