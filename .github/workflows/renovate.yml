name: Renovate

# Zero always-on footprint: GitHub's cron queues the job, the autostart watchdog
# wakes the CI VM, Renovate runs there, and the watchdog powers it back down.

on:
  schedule:
    - cron: "0 3,15 * * *" # ~05:00 / 17:00 Europe/Berlin (cron is UTC)
  workflow_dispatch:
    inputs:
      dryRun:
        description: Run Renovate in dry-run mode (log only, no PRs)
        type: boolean
        default: false
      logLevel:
        description: Log level
        type: choice
        options: [info, debug]
        default: info

concurrency: renovate

permissions:
  contents: read

jobs:
  renovate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Public repos only: this endpoint never returns private ones, and resolving
      # it per run picks up new and newly-public repos without editing this file.
      - name: Resolve public repositories
        id: public_repos
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          repos=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/dev-lukas/repos?type=owner&per_page=100" \
            | jq -c '[.[] | select(.archived | not) | .full_name] | sort')
          echo "Public repos ($(jq length <<<"$repos")): $(jq -r 'join(", ")' <<<"$repos")"
          echo "list=$repos" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.17
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate-global.js
          renovate-version: 43.251.0
        env:
          RENOVATE_PUBLIC_REPOS: ${{ steps.public_repos.outputs.list }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
          RENOVATE_REGISTRY_PASSWORD: ${{ secrets.RENOVATE_REGISTRY_PASSWORD }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
