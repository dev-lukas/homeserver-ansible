name: Renovate

# Self-hosted Renovate with zero always-on footprint: GitHub's cron queues
# the job, the ci-runner autostart watchdog wakes VM 108, Renovate runs in
# docker on the runner, and the watchdog shuts the VM down again when idle.

on:
  schedule:
    - cron: "0 3,15 * * *" # ~05:00 / 17:00 Europe/Berlin (cron is UTC)
  workflow_dispatch:
    inputs:
      dryRun:
        description: Run Renovate in dry-run mode (log only, no PRs)
        type: boolean
        default: false
      logLevel:
        description: Log level
        type: choice
        options: [info, debug]
        default: info

concurrency: renovate

permissions:
  contents: read

jobs:
  renovate:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Renovate is limited to PUBLIC repositories: the list is resolved fresh
      # on every run (this API endpoint only ever returns public repos, even
      # when authenticated as the owner), so visibility changes and new public
      # repos are picked up automatically without touching this file.
      - name: Resolve public repositories
        id: public_repos
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          repos=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/dev-lukas/repos?type=owner&per_page=100" \
            | jq -c '[.[] | select(.archived | not) | .full_name] | sort')
          echo "Public repos ($(jq length <<<"$repos")): $(jq -r 'join(", ")' <<<"$repos")"
          echo "list=$repos" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate-global.js
          renovate-version: 43.251.0
        env:
          RENOVATE_PUBLIC_REPOS: ${{ steps.public_repos.outputs.list }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
          RENOVATE_REGISTRY_PASSWORD: ${{ secrets.RENOVATE_REGISTRY_PASSWORD }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
