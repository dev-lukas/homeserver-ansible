[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Vendored proton_pass lookup, see plugins/lookup/proton_pass.py.
lookup_plugins = plugins/lookup
host_key_checking = False
retry_files_enabled = False

[privilege_escalation]
become = False

# Secrets come from Proton Pass; see inventory/group_vars/proxmox/secrets.yml.
[proton_pass_lookup]
vault = homeserver

# Keys are served by the Proton Pass SSH agent on the controller. The agent is
# forwarded so Proxmox can ssh into guests without a key on its disk.
[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentityAgent=~/.ssh/proton-pass-agent.sock -o ForwardAgent=~/.ssh/proton-pass-agent.sock
