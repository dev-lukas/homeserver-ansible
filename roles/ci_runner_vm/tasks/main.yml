---
# CI Runner VM role
# Creates a lean Debian 13 VM with per-repo GitHub Actions runners and the
# CI toolchain. (The container registry lives in its own LXC: registry_lxc.)

- name: Check if VM exists
  ansible.builtin.command:
    cmd: "qm status {{ ci_runner_vmid }}"
  register: vm_status
  failed_when: false
  changed_when: false
  # Tagged so a targeted run (e.g. --tags ci_runner to self-heal a runner) still
  # establishes VM state, powers it on and registers the delegation host below.
  tags:
    - ci_runner
    - ci
    - vm

# Pause the autostart watchdog for the duration of this play: it would
# otherwise `qm shutdown` the VM mid-configuration once GitHub shows no
# active jobs for 10 minutes. Re-enabled at the end of the role. If a run
# aborts in between, restart it with:
#   systemctl start ci-runner-autostart.timer
- name: Pause ci-runner autostart watchdog during provisioning
  ansible.builtin.systemd:
    name: ci-runner-autostart.timer
    state: stopped
  failed_when: false
  tags:
    - ci_runner
    - ci
    - vm

# Phase 1: Create VM on Proxmox host
- name: Download Debian cloud image if not present
  ansible.builtin.get_url:
    url: "{{ ci_runner_cloud_image_url }}"
    dest: "{{ ci_runner_cloud_image_path }}"
    mode: "0644"
    timeout: 600
  register: cloud_image_download
  when: vm_status.rc != 0

- name: Create CI Runner VM
  ansible.builtin.command:
    cmd: >
      qm create {{ ci_runner_vmid }}
      --name {{ ci_runner_hostname }}
      --memory {{ ci_runner_memory }}
      --cores {{ ci_runner_cores }}
      --cpu cputype=host
      --net0 virtio,bridge={{ ci_runner_bridge }}
      --scsihw virtio-scsi-pci
      --serial0 socket
      --vga serial0
      --agent enabled=1
      --onboot {{ ci_runner_onboot }}
  when: vm_status.rc != 0

# CI Runner is on-demand: it is powered on by the ci_runner_autostart watchdog
# when GitHub jobs queue, and shut down again when idle. Enforce onboot here so
# already-created VMs pick up the setting too (qm create only runs on first build).
- name: Ensure CI Runner onboot matches desired state
  ansible.builtin.shell: |
    cur=$(qm config {{ ci_runner_vmid }} | awk '/^onboot:/{print $2}')
    cur=${cur:-0}
    if [ "$cur" != "{{ ci_runner_onboot }}" ]; then
      qm set {{ ci_runner_vmid }} --onboot {{ ci_runner_onboot }}
      echo CHANGED
    fi
  register: ci_runner_onboot_set
  changed_when: "'CHANGED' in ci_runner_onboot_set.stdout"
  tags:
    - onboot

# Reconcile CPU/RAM/disk of the existing VM with the desired vars (qm create
# only applies them on first build). May shut the VM down; the "Start the VM"
# task below boots it with the new specs.
- name: Reconcile VM specs with desired values
  ansible.builtin.include_tasks:
    file: reconcile.yml
    apply:
      tags:
        - ci_runner
        - ci
        - vm
  when: vm_status.rc == 0
  tags:
    - ci_runner
    - ci
    - vm

- name: Import cloud image as disk
  ansible.builtin.command:
    cmd: >
      qm disk import {{ ci_runner_vmid }}
      {{ ci_runner_cloud_image_path }}
      {{ ci_runner_storage }}
  register: disk_import
  when: vm_status.rc != 0

- name: Attach imported disk to VM
  ansible.builtin.command:
    cmd: >
      qm set {{ ci_runner_vmid }}
      --scsi0 {{ ci_runner_storage }}:vm-{{ ci_runner_vmid }}-disk-0
      --boot order=scsi0
  when: vm_status.rc != 0

- name: Resize disk to target size
  ansible.builtin.command:
    cmd: "qm disk resize {{ ci_runner_vmid }} scsi0 {{ ci_runner_disk_size }}G"
  when: vm_status.rc != 0

- name: Configure cloud-init drive
  ansible.builtin.command:
    cmd: "qm set {{ ci_runner_vmid }} --ide2 {{ ci_runner_storage }}:cloudinit"
  when: vm_status.rc != 0

- name: Configure cloud-init network settings
  ansible.builtin.command:
    cmd: >
      qm set {{ ci_runner_vmid }}
      --ciuser root
      --ipconfig0 ip={{ ci_runner_ip }}/{{ ci_runner_netmask }},gw={{ ci_runner_gateway }}
      --nameserver {{ ci_runner_nameserver }}
      --searchdomain local
  when: vm_status.rc != 0

- name: Write all SSH public keys to temp file for cloud-init
  ansible.builtin.copy:
    content: |
      {{ vault_ansible_deploy_public_key }}
      {% for key in ssh_authorized_keys %}{% if key is string %}{{ key }}
      {% endif %}{% endfor %}
    dest: /tmp/vm_ssh_keys.pub
    mode: "0644"
  when: vm_status.rc != 0

- name: Configure cloud-init SSH keys
  ansible.builtin.command:
    cmd: "qm set {{ ci_runner_vmid }} --sshkeys /tmp/vm_ssh_keys.pub"
  when: vm_status.rc != 0

- name: Remove temp public key file
  ansible.builtin.file:
    path: /tmp/vm_ssh_keys.pub
    state: absent
  when: vm_status.rc != 0

- name: Regenerate cloud-init image
  ansible.builtin.command:
    cmd: "qm cloudinit update {{ ci_runner_vmid }}"
  when: vm_status.rc != 0

- name: Start the VM
  ansible.builtin.command:
    cmd: "qm start {{ ci_runner_vmid }}"
  register: start_result
  failed_when: false
  changed_when: start_result.rc == 0
  tags:
    - ci_runner
    - ci
    - vm

- name: Wait for VM to boot and get SSH ready
  ansible.builtin.wait_for:
    host: "{{ ci_runner_ip }}"
    port: 22
    delay: 10
    timeout: 300
  when: start_result.changed or vm_status.rc != 0
  tags:
    - ci_runner
    - ci
    - vm

- name: Wait additional time for cloud-init to complete
  ansible.builtin.pause:
    seconds: 30
  when: vm_status.rc != 0

# Phase 2: Configure VM via SSH using add_host
- name: Add VM to in-memory inventory
  ansible.builtin.add_host:
    name: "{{ ci_runner_hostname }}"
    ansible_host: "{{ ci_runner_ip }}"
    ansible_user: root
    ansible_ssh_private_key_file: /tmp/.ansible_deploy_key
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    groups: ci_runner_target
  tags:
    - ci_runner
    - ci
    - vm

# Phase 3: Configure the VM (delegate to new host)
- name: Configure the CI Runner VM
  block:
    - name: Wait for cloud-init to finish
      ansible.builtin.shell:
        cmd: "cloud-init status --wait || cloud-init status"
      changed_when: false
      register: cloud_init_status
      until: "'status: done' in cloud_init_status.stdout or 'status: disabled' in cloud_init_status.stdout"
      retries: 30
      delay: 10
      failed_when: "'status: error' in cloud_init_status.stdout"

    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - gnupg2
          - ca-certificates
          - lsb-release
          - apt-transport-https
          - sudo
          - cron
          - qemu-guest-agent
          - jq
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Enable and start qemu-guest-agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        state: started
        enabled: true

    - name: Apply security hardening
      ansible.builtin.include_tasks:
        file: harden_vm.yml
        apply:
          tags:
            - ci_runner
            - ci
            - vm
      tags:
        - ci_runner
        - ci
        - vm

    - name: Install and configure UFW firewall
      ansible.builtin.include_tasks:
        file: firewall.yml
        apply:
          tags:
            - ci_runner
            - ci
            - vm
      tags:
        - ci_runner
        - ci
        - vm

    - name: Install Docker Engine
      ansible.builtin.include_tasks:
        file: docker.yml
        apply:
          tags:
            - ci_runner
            - ci
            - vm
      tags:
        - ci_runner
        - ci
        - vm

    - name: Install GitHub Actions runner
      ansible.builtin.include_tasks:
        file: github_runner.yml
        apply:
          tags:
            - ci_runner
            - ci
            - vm
      tags:
        - ci_runner
        - ci
        - vm

    - name: Install CI toolchain (shared caches, uv pythons, playwright deps)
      ansible.builtin.include_tasks:
        file: toolchain.yml
        apply:
          tags:
            - ci_runner
            - ci
            - vm
            - toolchain
      tags:
        - ci_runner
        - ci
        - vm
        - toolchain

    - name: Configure unattended upgrades
      ansible.builtin.include_tasks:
        file: unattended_upgrades.yml
        apply:
          tags:
            - ci_runner
            - ci
            - vm
      tags:
        - ci_runner
        - ci
        - vm

  delegate_to: "{{ ci_runner_hostname }}"

# Phase 4: Configure Proxmox firewall (after VM is fully configured)
- name: Configure Proxmox firewall for VM
  ansible.builtin.include_tasks:
    file: proxmox_firewall.yml
    apply:
      tags:
        - ci_runner
        - ci
        - vm
  tags:
    - ci_runner
    - ci
    - vm

# Counterpart to the pause at the top of this role. The watchdog resumes
# start/stop duty; it will shut the VM down again once GitHub shows no
# active jobs for the idle window.
- name: Resume ci-runner autostart watchdog
  ansible.builtin.systemd:
    name: ci-runner-autostart.timer
    state: started
  failed_when: false
  tags:
    - ci_runner
    - ci
    - vm
