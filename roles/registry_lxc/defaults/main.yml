---
# Plain systemd service, not Docker: one idle Go binary adds ~zero wakeups and
# keeps the host's deep C-states. :5000 is reachable only from the reverse proxy.

registry_lxc_vmid: 106
registry_lxc_hostname: registry
registry_lxc_ip: "192.168.178.14"
registry_lxc_netmask: "24"
registry_lxc_gateway: "192.168.178.1"
registry_lxc_bridge: "vmbr0"
registry_lxc_nameserver: "192.168.178.2"

registry_lxc_template: "local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst"
registry_lxc_template_download: "debian-13-standard_13.1-2_amd64.tar.zst"

registry_lxc_storage: "vmpool"
registry_lxc_rootfs_size: 4
registry_lxc_memory: 512
registry_lxc_swap: 256
registry_lxc_cores: 2
registry_lxc_unprivileged: true

registry_lxc_ssh_port: 22

# recordsize=1M suits large sequential layer blobs; uid 1000 maps to host 101000.
registry_lxc_dataset: "mediapool/registry"
registry_lxc_data_source: "/mediapool/registry/data"
registry_lxc_data_mp: "/var/lib/registry"
registry_lxc_data_host_owner: 101000

# Distribution (registry) release, pinned + checksummed.
registry_lxc_version: "3.0.0"
registry_lxc_binary_sha256: "61c9a2c0d5981a78482025b6b69728521fbc78506d68b223d4a2eb825de5ca3d"
registry_lxc_download_url: "https://github.com/distribution/distribution/releases/download/v{{ registry_lxc_version }}/registry_{{ registry_lxc_version }}_linux_amd64.tar.gz"

registry_lxc_port: 5000
registry_lxc_user: registry
registry_lxc_user_uid: 1000

# bcrypt REQUIRED (v3 rejects apr1/MD5). nginx forwards the Authorization header,
# so this file and the vhost's must hold the same credentials.
registry_lxc_htpasswd: "{{ vault_reverse_proxy_auth_basic_users.registry }}"

# Plaintext for the retention script; same account as the htpasswd hash above.
registry_lxc_retention_credentials: "{{ vault_registry_retention_credentials }}"

# Only the reverse proxy may reach :5000.
registry_lxc_allowed_5000_sources:
  - "192.168.178.4"

# Keep non-SHA tags plus the newest N SHA tags per repo, then garbage-collect.
registry_lxc_retention_keep_tags: 5
registry_lxc_retention_cron_minute: "30"
registry_lxc_retention_cron_hour: "5"
registry_lxc_retention_cron_weekday: "0"
