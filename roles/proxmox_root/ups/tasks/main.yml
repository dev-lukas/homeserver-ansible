---
# NUT (Network UPS Tools) configuration for Eaton 3S 550 UPS

- name: Install NUT packages
  ansible.builtin.apt:
    name:
      - nut
      - nut-client
      - nut-server
    state: present
    update_cache: true

- name: Create udev rule for Eaton UPS
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/90-nut-ups.rules
    content: |
      # Eaton 3S 550 UPS - allow nut group access
      SUBSYSTEM=="usb", ATTR{idVendor}=="0463", MODE="0660", GROUP="nut"
    owner: root
    group: root
    mode: "0644"
  notify: Reload udev rules

- name: Configure NUT mode
  ansible.builtin.copy:
    dest: /etc/nut/nut.conf
    content: |
      MODE=standalone
    owner: root
    group: nut
    mode: "0640"
  notify: Restart NUT services

- name: Configure UPS driver (ups.conf)
  ansible.builtin.copy:
    dest: /etc/nut/ups.conf
    content: |
      [eaton]
        driver = usbhid-ups
        port = auto
        desc = "Eaton 3S 550"
        vendorid = 0463
        override.battery.charge.low = {{ ups_shutdown_battery_percent }}
    owner: root
    group: nut
    mode: "0640"
  notify: Restart NUT services

- name: Configure upsd (upsd.conf)
  ansible.builtin.copy:
    dest: /etc/nut/upsd.conf
    content: |
      LISTEN 127.0.0.1 3493
    owner: root
    group: nut
    mode: "0640"
  notify: Restart NUT services

- name: Configure upsd users (upsd.users)
  ansible.builtin.copy:
    dest: /etc/nut/upsd.users
    content: |
      [upsmon]
        password = {{ ups_monitor_password | default('changeme') }}
        upsmon master
    owner: root
    group: nut
    mode: "0640"
  notify: Restart NUT services

- name: Configure upsmon (upsmon.conf)
  ansible.builtin.template:
    src: upsmon.conf.j2
    dest: /etc/nut/upsmon.conf
    owner: root
    group: nut
    mode: "0640"
  notify: Restart NUT services

- name: Ensure NUT services are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nut-server
    - nut-monitor

# UPS stats for Homepage dashboard. Pushed over SSH like the ECC stats;
# root's key is authorized on the apps LXC by the rasdaemon role.
- name: Check if local-services LXC is reachable
  ansible.builtin.wait_for:
    host: "{{ apps_lxc_ip }}"
    port: 22
    timeout: 5
  register: ups_lxc_reachable
  failed_when: false

- name: Deploy UPS stats script
  ansible.builtin.copy:
    src: ups-stats.sh
    dest: /usr/local/bin/ups-stats.sh
    mode: "0755"

- name: Create cron job for UPS stats
  ansible.builtin.cron:
    name: "Update UPS stats for Homepage"
    minute: "*"
    job: "/usr/local/bin/ups-stats.sh {{ apps_lxc_ip }} /opt/stacks/homepage/api/ups.json > /dev/null 2>&1"
  when: ups_lxc_reachable.state is defined and ups_lxc_reachable.state == "started"

- name: Run UPS stats script once to create initial JSON
  ansible.builtin.command:
    cmd: /usr/local/bin/ups-stats.sh {{ apps_lxc_ip }} /opt/stacks/homepage/api/ups.json
  when: ups_lxc_reachable.state is defined and ups_lxc_reachable.state == "started"
  changed_when: true
  failed_when: false
