---
# A Proxmox API token that can start and shut down the dev VM and nothing else.
# Home Assistant calls the API directly, so no daemon or HA credential on the host.

ha_vm_control_enabled: true

# Defaults to the dev_vm role's value in the same play, for one source of truth.
ha_vm_control_vmid: "{{ dev_vm_vmid | default(107) }}"

# Audit + PowerMgmt only: no Console, Config, Allocate or Sys.*. Do not widen
# this to make something else convenient — create a separately scoped token.
ha_vm_control_role: "HAVMPower"
ha_vm_control_privs:
  - "VM.Audit"
  - "VM.PowerMgmt"

# Token-only identity: no password is set, so it cannot log into the web UI.
ha_vm_control_user: "hass@pve"
ha_vm_control_token_name: "dev-vm"

# Privsep: the token gets its own ACL, so widening the user never widens the token.
ha_vm_control_token_privsep: true
